<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
</head>
<body>
    <h2>Reset Your Password</h2>
    <form id="resetPasswordForm">
        <label for="newPassword">New Password:</label>
        <input type="password" id="newPassword" name="newPassword" placeholder="type new password" required>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="confirm new Password" required>
        <button type="submit">Reset Password</button>
    </form>
    
</body>
<script>
        const form = document.getElementById('resetPasswordForm');
        alert("hello")
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }

            const urlParams = new URLSearchParams(window.location.search);
            const id = window.location.href.split('/').pop();
            console.log("bbbbb",window.location.search)

            try {
                const response = await fetch(`http://localhost:3000/password/resetpassword/${id}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ password: newPassword }),
                });
                //response from backend
                const data = await response.json();
                console.log("data",data)
console.log("response",response)
                if (data.message === 'Password reset successfully!') {
                    alert('Password reset successfully!');
                } else {
                    alert('Error resetting password.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error resetting password.');
            }
        });
    </script>
</html>
